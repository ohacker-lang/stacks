# Primary Stacks project. This identifier is safe to commit; credentials stay
# in the Supabase CLI session and Supabase project secrets.
project_id = "whyufyttlvpiwlunosjm"

# Every app-facing function requires an authenticated Supabase user. The only
# public endpoint is the future read-only web preview, which must still enforce
# Stack visibility internally before it returns any data.
