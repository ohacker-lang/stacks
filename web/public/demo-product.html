<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Beanie · Stacks</title>
  <link rel="icon" type="image/png" href="/assets/stacks-logo.png">
  <link rel="stylesheet" href="/site.css">
  <script src="/site.js" defer></script>
  <script src="/analytics.js" defer></script>
</head>
<body class="product-page">
  <main class="product-main">
    <nav class="product-navigation" aria-label="Product navigation">
      <a class="product-nav-circle" href="/demo/beanies" aria-label="Back to Beanies">‹</a>
      <details class="product-options"><summary class="product-nav-circle" aria-label="Product options">···</summary><div class="product-options-menu"><a href="/demo/beanies">Back to Beanies</a><a href="/waitlist">Join the waitlist</a></div></details>

    <div class="product-stage"><img id="demo-product-image" src="" alt=""></div>
    <h1 id="demo-product-title">Beanie</h1>
    <section class="product-info" aria-label="Product information">
      <div class="product-info-row"><span>Brand</span><strong id="demo-product-brand">—</strong></div>
      <div class="product-info-row"><span>Price</span><strong id="demo-product-price">Check store</strong></div>
    </section>
  </main>
  <aside class="product-actions">
    <p id="demo-product-disclosure" hidden></p>
    <a id="demo-product-link" class="product-buy" href="#" target="_blank" rel="noopener noreferrer"><span>Buy from the store</span><span aria-hidden="true">↗</span></a>
    <a class="product-download" href="/waitlist">Claim your username</a>
  </aside>

</html>
